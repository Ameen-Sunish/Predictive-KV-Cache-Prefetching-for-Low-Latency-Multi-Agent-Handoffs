[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teleportcache"
version = "0.1.0"
description = "Predictive KV-Cache Prefetching for Low-Latency Multi-Agent Handoffs"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["teleportcache*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
